{% load static %}
<section class='header px-5'>
    <div class='d-flex align-items-center justify-content-between'>
        <p>Bienvenue dans la boutique de commerce électronique en ligne DIC1.</p>
        <div class='d-flex align-items-center justify-content-between'>
            <p>Suivez-nous:</p>
            <ul>
                <i class="fa-brands fa-twitter" style="color: #ffffff;"></i>
                <i class="fa-brands fa-pinterest-p" style="color: #ffffff;"></i>
                <i class="fa-brands fa-pinterest-p" style="color: #ffffff;"></i>
                <i class="fa-brands fa-discord" style="color: #ffffff;"></i>
                <i class="fa-brands fa-instagram" style="color: #ffffff;"></i>
                <i class="fa-brands fa-instagram" style="color: #ffffff;"></i>
            </ul>
            <select class="form-select langue" aria-label="Default select example" style='width:75px;'>
                <option value="fr" selected>Fra</option>
                <option value="en">Eng</option>
            </select>
            <select class="form-select langue" aria-label="Default select example" style='width:80px;'>
                <option value="usd" selected>USD</option>
                <option value="veu">VEU</option>
            </select>
        </div>
    </div>
    <div class="hr w-100" style="height: 1px;"></div>
    <div class='d-flex align-items-center justify-content-between'>
        <li class="d-flex align-items-center align-items-center">
            <img class='me-0' src="{% static 'images/logo_shop_1.png' %}" alt="logo" style='width:50px;height:40px;position:relative;left:-10px'>
            <h6 class="text-light d-inline-block p-0 m-0" style="font-size: 18px !important;"><b>Boutique DIC1</b></h6>
        </li>
        <div class="input-group rounded" style='30%'>
            <input type="search" class="form-control rounded" placeholder="Rechercher n'importe quoi..." aria-label="Search" aria-describedby="search-addon" />
            <span class="input-group-text border-0" id="search-addon">
              <i class="fas fa-search"></i>
            </span>
        </div>
        <ul>
            <li></li>
            <li></li>
        </ul>
    </div>
</section>
