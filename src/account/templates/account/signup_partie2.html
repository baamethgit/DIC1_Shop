{% extends "base.html" %}
{% load static %}
{% block content %}
      <div class="wrapper my-5 mx-auto px-4 py-3">
         <div class="form-container">
            <div class="slide-controls">
               <input type="radio" name="slide" id="login" >
               <input type="radio" name="slide" id="signup" checked>
               <label for="login" class="slide login"> 
                  <a href = '{% url "signup-login-view"%}' class='w-100' style='display: inline-block;color:gray;text-decoration:none'>Connexion</a>
                </label>
               <label for="signup" class="slide signup">Une inscription</label>
               <div class="slider-tab"></div>
            </div>
            <div class="form-inner">
               <form class="signup" method = 'POST'>
                {% csrf_token %}
                {{form.as_p}}
                <p class='text-primary d-flex' style='font-size:14px;'>
                  <input type="checkbox" id="regles_utilisation" name="regles_utilisation">
                  <label for="regles_utilisation">Êtes-vous d'accord avec les conditions d'utilisation 
                    et la politique de confidentialité ?.
                  </label>
                </p>
                  <p class='text-danger'>{{signup_message}}</p>
                  <span class="submit_btn">
                    <input type="submit" value="Suivant" class='py-2 fw-bold ' name='signup_form'>
                    <i class="bi bi-arrow-right" style='cursor:pointer;'></i>
                  </span>
               </form>
            </div>
         </div>
      </div>
      <script type='text/javascript'>
      </script>
<style>
    ::selection{
    {% comment %} background: #fa4299; {% endcomment %}
    color: #fff;
  }
  .wrapper{
    {% comment %} overflow: hidden; {% endcomment %}
    max-width: 390px;
    background: #fff;
    box-shadow: 0px 15px 20px rgba(0,0,0,0.1);
  }
  .wrapper .title-text{
    display: flex;
    width: 200%;
  }
  .wrapper .slide-controls{
    position: relative;
    display: flex;
    height: 50px;
    width: 100%;
    overflow: hidden;
    margin: 30px 0 10px 0;
    justify-content: space-between;
    border-bottom: 1px solid lightgrey;
  }
  .slide-controls .slide{
    height: 100%;
    width: 100%;
    color: #fff;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    line-height: 48px;
    cursor: pointer;
    z-index: 1;
  }
  .slide-controls label.signup{
    color: #000;
  }
  .slide-controls .slider-tab{
    position: absolute;
    height: 100%;
    width: 50%;
    left: 0;
    z-index: 0;
    border-bottom : 2px solid #FA8232;
  }
  input[type="radio"]{
    display: none;
  }
  #signup:checked ~ .slider-tab{
    left: 50%;
  }
  #signup:checked ~ label.signup{
    color: black;
    cursor: default;
    user-select: none;
  }
  #signup:checked ~ label.login{
    color: gray;
  }
  #login:checked ~ label.signup{
    color: gray;
  }
  #login:checked ~ label.login{
    cursor: default;
    user-select: none;
    color: black;
  }
  .wrapper .form-container{
    width: 100%;
    overflow: hidden;
  }
  .form-container .form-inner{
    display: flex;
    width: 200%;
  }
  .form-container .form-inner form{
    width: 50%;
    transition: all 0.6s;
  }
  .form-inner form .field{
    height: 50px;
    width: 100%;
    margin-top: 20px;
  }
  .form-inner form .field input{
    height: 100%;
    width: 100%;
    outline: none;
    padding-left: 15px;
  }


  {% comment %} .form-inner form .pass-link{
    margin-top: 5px;
  } {% endcomment %}
  .form-inner form .signup-link{
    text-align: center;
    margin-top: 30px;
  }
  {% comment %} .form-inner form .pass-link a, {% endcomment %}
  .form-inner form .signup-link a{
    color: #fa4299;
    text-decoration: none;
  }
  {% comment %} .form-inner form .pass-link a:hover, {% endcomment %}
  .form-inner form .signup-link a:hover{
    text-decoration: underline;
  }

  #regles_utilisation:checked{
    background-color:red;
    outline:none;
    border:none;
  }
</style>
{% endblock content %}
